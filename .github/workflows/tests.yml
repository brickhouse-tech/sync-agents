name: ci

on:
  workflow_call:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm install
      - run: npm test

  # Pre-staged for when Node 26 drops. Uses continue-on-error so a
  # missing/unavailable 26.x runner doesn't block the gate. Remove
  # continue-on-error + merge into the main matrix when 26 is stable.
  test-edge:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm install
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Go unit tests with coverage
        run: |
          go test -coverprofile=coverage.out \
            -coverpkg=./internal/... \
            ./internal/agent/... ./internal/version/...

      - name: Report per-package coverage
        run: |
          echo '## Coverage by package'
          go tool cover -func=coverage.out | grep -v 'total:' | while read pkg fn pct; do
            case "$pkg" in
              github.com/*) ;;
              *) continue ;;
            esac
            echo "$pkg  $fn  $pct"
          done

      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//')
          THRESHOLD=45
          echo "Total coverage: ${TOTAL}% (threshold: ${THRESHOLD}%)"
          if (( $(echo "$TOTAL < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${TOTAL}% is below the ${THRESHOLD}% minimum"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  gate:
    name: gate
    needs: [test, coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          results=($(echo '${{ toJSON(needs.*.result) }}' | jq -r '.[]'))
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "One or more jobs failed: $r"
              exit 1
            fi
          done
          echo "All jobs passed"