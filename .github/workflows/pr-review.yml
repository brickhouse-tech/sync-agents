name: PR Code Review

# AI review via OpenRouter (deepseek-v4-flash, qwen fallback).
# Logic lives in .github/scripts/pr-review.mjs: it reviews the diff only,
# posts inline comments where the diff supports them, and maintains ONE
# sticky summary comment per PR (marker <!-- pr-review-bot -->).
# The reviewer never blocks merges — failures are reported in the sticky
# comment and the step continues on error.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: AI code review (OpenRouter)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/pr-review.mjs
