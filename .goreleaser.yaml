version: 2
project_name: sync-agents

before:
  hooks:
    - ./scripts/goreleaser-check-version.sh {{ .Tag }}
    - go mod tidy

builds:
  - id: sync-agents
    main: ./
    binary: sync-agents
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/brickhouse-tech/sync-agents/internal/version.Version={{ .Env.SYNC_AGENTS_VERSION }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - repository:
      owner: brickhouse-tech
      name: homebrew-tap
    homepage: https://github.com/brickhouse-tech/sync-agents
    description: One set of agent rules to rule them all — sync AI coding agent configs across providers
    license: MIT
    binaries:
      - sync-agents

# goreleaser owns the GitHub Release end-to-end: it creates the release,
# generates notes from the changelog, and uploads assets. The org-reusable
# auto-release.yml step was removed so two workflows no longer race to
# create the same release. `replace` makes re-runs on a tag idempotent.
release:
  github:
    owner: brickhouse-tech
    name: sync-agents
  draft: false
  prerelease: auto
  mode: replace

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^chore\(release\):'
      - '^Merge pull request'
      - '^Merge branch'
      - '^Merge remote-tracking'
